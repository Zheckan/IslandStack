name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no token secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if this version is new
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "skellige@$version" version >/dev/null 2>&1; then
            echo "skellige@$version is already on npm. Bump the version to publish."
          else
            npm publish
          fi
